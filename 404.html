<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — Shailesh Maddikera</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono&family=Instrument+Serif:ital@1&display=swap" />
  <style>
    :root { --bg: #f6f5f1; --ink: #111113; --muted: #85858c; --accent: #3d6a00; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --ink: #ededee; --muted: #78787f; --accent: #c8f542; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font-family: "Geist", system-ui, sans-serif; padding: 16px; text-align: center; }
    h1 { font-size: clamp(96px, 24vw, 260px); margin: 0; letter-spacing: -.06em; font-weight: 600; line-height: .9; }
    h1 em { font-family: "Instrument Serif", serif; font-weight: 400; color: var(--accent); }
    p { color: var(--muted); font-family: "Geist Mono", monospace; text-transform: uppercase; font-size: 12px; letter-spacing: .04em; }
    a { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 500; }
  </style>
</head>

  <main>
    <h1>4<em>0</em>4</h1>
